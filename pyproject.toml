[project]
name = "fact-knowledge-layer"
version = "0.1.0"
description = "Cross-Document Fact Knowledge Layer with Contextual Reconciliation"
readme = "README.md"
requires-python = ">=3.12,<3.13"
dependencies = [
    # PDF Ingestion & OCR/Layout
    "pypdf>=5.1.0",
    "pymupdf>=1.25.0",
    "pdfplumber>=0.11.0",
    "pytesseract>=0.3.10",
    "pillow>=11.0.0",

    # Data Modeling & Validation
    "pydantic>=2.10.0",
    "pydantic-settings>=2.7.0",

    # LLM & Embedding Runtime
    "openai>=1.60.0",
    "litellm>=1.59.0",
    "sentence-transformers>=3.4.0",
    "torch>=2.2.0",
    "numpy>=1.26.0,<2.0.0",

    # In-Corpus Storage & Vector Search
    "duckdb>=1.1.3",
    "chromadb>=0.6.0",

    # API & Serving
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.34.0",
    "python-multipart>=0.0.20",

    # Interactive UI
    "streamlit>=1.41.0",

    # Utilities & Testing
    "rich>=13.9.0",
    "typer>=0.15.0",
    "httpx>=0.28.0",
    "python-dotenv>=1.0.1",
    "pytest>=8.3.0",
    "pytest-asyncio>=0.25.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src"]

[tool.pytest.ini_options]
filterwarnings = [
    "ignore::DeprecationWarning",
    "ignore::PendingDeprecationWarning",
    "ignore:.*starlette.*:Warning",
]

[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true

[tool.uv.sources]
torch = { index = "pytorch-cpu" }
